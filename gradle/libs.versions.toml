[versions]
errorprone = "2.50.0"
errorpronePlugin = "5.1.0"
flyway = "11.3.4"
h2 = "2.3.232"
joml = "1.10.8"
jspecify = "1.0.0"
junit = "6.1.3"
lwjgl = "3.4.3"
lwjglPlugin = "1.0.2"
micronautPlatform = "4.10.18"
mysql = "9.2.0"
nullaway = "0.13.8"
nullawayPlugin = "3.1.0"
spotlessPlugin = "8.9.0"

[libraries]
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
joml = { module = "org.joml:joml", version.ref = "joml" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
micronaut-flyway = { module = "io.micronaut.flyway:micronaut-flyway" }
micronaut-http-client = { module = "io.micronaut:micronaut-http-client" }
micronaut-http-server-netty = { module = "io.micronaut:micronaut-http-server-netty" }
micronaut-inject-java = { module = "io.micronaut:micronaut-inject-java" }
micronaut-jdbc-hikari = { module = "io.micronaut.sql:micronaut-jdbc-hikari" }
micronaut-platform = { module = "io.micronaut.platform:micronaut-platform", version.ref = "micronautPlatform" }
micronaut-serde-jackson = { module = "io.micronaut.serde:micronaut-serde-jackson" }
micronaut-serde-processor = { module = "io.micronaut.serde:micronaut-serde-processor" }
micronaut-test-junit5 = { module = "io.micronaut.test:micronaut-test-junit5" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
snakeyaml = { module = "org.yaml:snakeyaml" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorpronePlugin" }
lwjgl3 = { id = "com.smushytaco.lwjgl3", version.ref = "lwjglPlugin" }
nullaway = { id = "net.ltgt.nullaway", version.ref = "nullawayPlugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotlessPlugin" }
